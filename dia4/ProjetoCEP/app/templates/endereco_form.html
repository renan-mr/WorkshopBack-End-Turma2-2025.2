<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Endereço</title>
</head>
<body>
    {% if object %}
        <h1>Editar Endereço</h1>
    {% else %}
        <h1>Criar Novo Endereço</h1>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <br>
    <a href="{% url 'endereco_list' %}">Cancelar e Voltar</a>

</body>
</html>

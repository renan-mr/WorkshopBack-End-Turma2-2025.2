<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Exclusão</title>
</head>
<body>
    <h1>Confirmar Exclusão</h1>

    <p>Tem certeza de que deseja apagar o endereço de "{{ object.rua }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, apagar</button>
        <a href="{% url 'endereco_list' %}">Cancelar</a>
    </form>

</body>
</html>
